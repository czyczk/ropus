[package]
name = "opus-core"
version = "0.12.18"
edition = "2024"
rust-version = "1.88"
description = "Shared pure-Rust Opus codec core (C-isomorphic modules), BSD-3-Clause."
license = "BSD-3-Clause"
repository = "https://github.com/0x4D44/ropus"

keywords = ["opus", "audio", "codec", "dsp"]
categories = ["multimedia::audio", "multimedia::encoding"]
authors = ["Martin Davidson <martingdavidson@gmail.com>"]
include = [
    "src/**/*",
    "examples/**/*",
    "build.rs",
    "build/**/*",
    "Cargo.toml",
    "README.md",
    "LICENSE",
]

[features]
default = []
# Compile the `wide`-based CELT SIMD kernels plus the explicit aarch64 NEON
# kernels (`neon2`). Disabling this feature keeps a bit-exact scalar fallback
# for xcorr, maxabs, band denormalisation, MDCT windowing, and the NEON
# kernels listed below. The decoder crate's default feature enables it;
# consumers can override with default-features = false.
simd = ["dep:wide", "neon2"]
# Explicit aarch64 NEON intrinsics kernels ("second NEON tier"): SILK
# resampler FIR/allpass, SILK recursive LPC/LTP synthesis dot products, CELT
# deemphasis stereo and MDCT dynamic-range scan. Bit-exact against the scalar
# paths. No-op outside aarch64. Enabled by `simd` by default; can be enabled
# standalone (`--no-default-features --features neon2`) to measure/audit the
# NEON kernels without the portable `wide` kernels.
neon2 = []
# Opt-in compilation of the original DNN/deep-PLC/DRED modules. OFF by
# default: this repository is scoped to RFC 6716 classical decoding and uses
# the inert stubs in lib.rs instead.
ml = []
# Phase B encode-side trace tuples for Cluster A stage 2b. Emits
# `(boundary_id, channel, ec_tell, rng, target_rate_bps, n_bits_exceeded,
# curr_n_bits_used_lbrr, n_bits_used_lbrr, mid_only_flag,
# prev_decode_only_middle)` records at the 7 boundary points enumerated
# in the encoder-state-accumulation HLD §2.3. Off by default; the
# diagnostic binary `fuzz_repro_diff` opts in. No production code path
# has trace-emit calls outside this gate.
trace-silk-encode = []

[dependencies]
wide = { version = "0.7", optional = true }

[dev-dependencies]
proptest = "1"
ogg = "0.9"
